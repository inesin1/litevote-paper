name: LiteVotePlugin
version: 1.1.0
main: io.nesin.voteplugin.VotePlugin
description: Lightweight voting plugin for day, night, and weather on Paper servers
author: NesinDev
website: https://nesin.dev
api-version: '1.21'

permissions:
  litevote.vote:
    description: Allows players to start and participate in votes
    default: true
  litevote.admin:
    description: Allows reloading the plugin configuration
    default: op
  litevote.bypass.cooldown:
    description: Allows starting votes without waiting for cooldown
    default: op

commands:
  vote:
    description: Start or participate in a vote
    usage: /vote <day|night|clear|rain|storm|yes|no|reload>
    aliases: [v]
    permission: litevote.vote